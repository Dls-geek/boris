name: Build and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt and layer-shell deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-wayland-dev \
            qt6-svg-dev \
            libqt6svg6 \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            layer-shell-qt \
            liblayershellqtinterface-dev \
            qt6-multimedia-dev \
            libqt6multimedia6 \
            pkg-config

      - name: Build
        run: |
          chmod +x bin/*
          bin/build

      - name: Test
        run: |
          QT_QPA_PLATFORM=offscreen bin/test

      - name: Package
        run: |
          BORIS_VERSION="${GITHUB_REF_NAME#v}"
          case "$BORIS_VERSION" in
            main|*-*) BORIS_VERSION=0.2.0 ;;
          esac
          export BORIS_VERSION
          bin/package
          echo "ARTIFACT=$(ls dist/boris-*.tar.gz | head -1)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: boris-linux-package
          path: dist/boris-*.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/boris-*.tar.gz
          generate_release_notes: false
