<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Boris the parrot">
  <!-- App icon: pirate parrot only. No mouse/cursor/pointer shapes. -->
  <rect width="64" height="64" rx="14" fill="#FFD60A"/>
  <!-- pirate bandana -->
  <path d="M18 22 C18 14 46 14 46 22 L44 28 L20 28 Z" fill="#2b221c"/>
  <path d="M46 20 L54 16 L48 26 Z" fill="#2b221c"/>
  <!-- head / body -->
  <ellipse cx="32" cy="38" rx="16" ry="15" fill="#3cba78"/>
  <ellipse cx="26" cy="44" rx="8" ry="7" fill="#e7ef9a"/>
  <!-- beak (rounded wedge, not a pointer arrow) -->
  <path d="M44 36 C52 38 52 42 44 44 C46 40 46 40 44 36 Z" fill="#ef8f32"/>
  <!-- eye -->
  <circle cx="40" cy="34" r="4" fill="#f7f4ea"/>
  <circle cx="41.2" cy="34" r="1.8" fill="#161814"/>
  <!-- wing hint -->
  <path d="M20 40 C14 42 14 50 22 52" fill="none" stroke="#2f9a5f" stroke-width="3" stroke-linecap="round"/>
</svg>
